<svg xmlns="http://www.w3.org/2000/svg" width="620" height="560" viewBox="0 0 620 560" role="img" aria-label="Vitor Bitencourt — terminal">
  <title>Vitor Bitencourt — terminal</title>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- efeito de digitação: a largura cresce do fim do prompt até o fim do comando -->
    <clipPath id="type1"><rect x="0" y="0" height="560" width="160">
      <animate attributeName="width" from="160" to="300" begin="0.6s" dur="1.0s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="0" y="0" height="560" width="160">
      <animate attributeName="width" from="160" to="250" begin="2.6s" dur="0.6s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="type3"><rect x="0" y="0" height="560" width="160">
      <animate attributeName="width" from="160" to="270" begin="4.6s" dur="0.75s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="type4"><rect x="0" y="0" height="560" width="160">
      <animate attributeName="width" from="160" to="280" begin="6.8s" dur="0.8s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 14px; white-space: pre; }
    .user { fill: #ff2a6d; font-weight: 700; }
    .host { fill: #7a5c9e; }
    .path { fill: #05d9e8; }
    .sym  { fill: #f9f871; font-weight: 700; }
    .cmd  { fill: #05d9e8; }
    .arg  { fill: #d1f7ff; }
    .out  { fill: #d1f7ff; }
    .mute { fill: #7a5c9e; }
    .head { fill: #f9f871; font-weight: 700; }
    .link { fill: #05d9e8; }
    .key  { fill: #ff2a6d; }
    .hide { opacity: 0; }
  </style>

  <g filter="url(#shadow)">
    <!-- janela -->
    <rect x="10" y="6" width="600" height="540" rx="12" fill="#0d0221" stroke="#ff2a6d" stroke-opacity=".7"/>
    <!-- barra de título -->
    <path d="M10 18a12 12 0 0 1 12-12h576a12 12 0 0 1 12 12v22H10z" fill="#1a0b3d"/>
    <line x1="10" y1="40" x2="610" y2="40" stroke="#3d1a6e"/>
    <circle cx="34" cy="23" r="7" fill="#ff2a6d"/>
    <circle cx="56" cy="23" r="7" fill="#f9f871"/>
    <circle cx="78" cy="23" r="7" fill="#05d9e8"/>
    <text x="310" y="28" text-anchor="middle" class="mute" style="font-size:12px">vitor@night-city — bash</text>

    <!-- barra de status -->
    <path d="M10 522h600v12a12 12 0 0 1-12 12H22a12 12 0 0 1-12-12z" fill="#1a0b3d"/>
    <line x1="10" y1="522" x2="610" y2="522" stroke="#3d1a6e"/>
    <text x="26" y="539" class="mute" style="font-size:11px">UTF-8 · bash · linux · main</text>
    <text x="594" y="539" text-anchor="end" class="mute" style="font-size:11px">pt-BR · UTC-03:00</text>
  </g>

  <!-- prompt 1 -->
  <g class="hide">
    <set attributeName="opacity" to="1" begin="0.4s" fill="freeze"/>
    <text x="24" y="70" clip-path="url(#type1)"><tspan class="user">vitor</tspan><tspan class="host">@github</tspan><tspan class="path">:~</tspan><tspan class="sym">$ </tspan><tspan class="cmd">whoami</tspan><tspan class="arg"> --verbose</tspan></text>
  </g>
  <g class="hide">
    <set attributeName="opacity" to="1" begin="1.8s" fill="freeze"/>
    <text x="24" y="94"><tspan class="out" font-weight="700">Vitor Bitencourt</tspan><tspan class="mute"> — </tspan><tspan class="head">python.developer</tspan><tspan class="mute"> · </tspan><tspan class="link">automações</tspan></text>
    <text x="24" y="116"><tspan class="key">github</tspan><tspan class="mute">: </tspan><tspan class="out">Vitor-BitencourtJ</tspan></text>
  </g>

  <!-- prompt 2 -->
  <g class="hide">
    <set attributeName="opacity" to="1" begin="2.4s" fill="freeze"/>
    <text x="24" y="156" clip-path="url(#type2)"><tspan class="user">vitor</tspan><tspan class="host">@github</tspan><tspan class="path">:~</tspan><tspan class="sym">$ </tspan><tspan class="cmd">cat</tspan><tspan class="arg"> now.md</tspan></text>
  </g>
  <g class="hide">
    <set attributeName="opacity" to="1" begin="3.4s" fill="freeze"/>
    <text x="24" y="180" class="head">## agora</text>
    <text x="24" y="202"><tspan class="mute">  - </tspan><tspan class="out">automatizando tarefas e criando APIs em </tspan><tspan class="head">Python</tspan></text>
    <text x="24" y="224"><tspan class="mute">  - </tspan><tspan class="out">construindo interfaces com </tspan><tspan class="link">React</tspan><tspan class="mute"> + </tspan><tspan class="link">TypeScript</tspan></text>
    <text x="24" y="246"><tspan class="mute">  - </tspan><tspan class="out">estudando </tspan><tspan class="link">C# / .NET</tspan></text>
    <text x="24" y="268"><tspan class="mute">  - </tspan><tspan class="out">transformando café em commits</tspan><tspan class="mute">  # e bugs em features</tspan></text>
  </g>

  <!-- prompt 3 -->
  <g class="hide">
    <set attributeName="opacity" to="1" begin="4.4s" fill="freeze"/>
    <text x="24" y="308" clip-path="url(#type3)"><tspan class="user">vitor</tspan><tspan class="host">@github</tspan><tspan class="path">:~</tspan><tspan class="sym">$ </tspan><tspan class="cmd">stack</tspan><tspan class="arg"> --list</tspan></text>
  </g>
  <g class="hide">
    <set attributeName="opacity" to="1" begin="5.6s" fill="freeze"/>
    <text x="24" y="332"><tspan class="key">  lang   </tspan><tspan class="head">python</tspan><tspan class="mute"> · </tspan><tspan class="out">javascript</tspan><tspan class="mute"> · </tspan><tspan class="out">typescript</tspan><tspan class="mute"> · </tspan><tspan class="out">c#</tspan></text>
    <text x="24" y="354"><tspan class="key">  front  </tspan><tspan class="out">react</tspan><tspan class="mute"> · </tspan><tspan class="out">html</tspan><tspan class="mute"> · </tspan><tspan class="out">css</tspan></text>
    <text x="24" y="376"><tspan class="key">  tools  </tspan><tspan class="out">git</tspan><tspan class="mute"> · </tspan><tspan class="out">vscode</tspan><tspan class="mute"> · </tspan><tspan class="out">linux</tspan></text>
  </g>

  <!-- prompt 4 -->
  <g class="hide">
    <set attributeName="opacity" to="1" begin="6.6s" fill="freeze"/>
    <text x="24" y="416" clip-path="url(#type4)"><tspan class="user">vitor</tspan><tspan class="host">@github</tspan><tspan class="path">:~</tspan><tspan class="sym">$ </tspan><tspan class="cmd">ls</tspan><tspan class="arg"> ./contatos</tspan></text>
  </g>
  <g class="hide">
    <set attributeName="opacity" to="1" begin="7.8s" fill="freeze"/>
    <text x="24" y="440"><tspan class="link">instagram/</tspan><tspan class="out">   </tspan><tspan class="link">linkedin/</tspan><tspan class="out">   </tspan><tspan class="link">gmail/</tspan></text>
  </g>

  <!-- prompt final + cursor piscando -->
  <g class="hide">
    <set attributeName="opacity" to="1" begin="8.4s" fill="freeze"/>
    <text x="24" y="490"><tspan class="user">vitor</tspan><tspan class="host">@github</tspan><tspan class="path">:~</tspan><tspan class="sym">$ </tspan></text>
    <rect x="162" y="477" width="9" height="17" fill="#05d9e8">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
